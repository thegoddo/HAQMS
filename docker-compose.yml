# ISSE 1: version 3.8 is not supported by all Docker Compose versions. You can use version 3 or omit the version field to ensure compatibility.
# version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: haqms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haqms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
